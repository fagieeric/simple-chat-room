<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Alpha | Secure Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            background: #0D0F12;
            color: #F3F4F6;
        }

        body { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        /* --- LANDING / LOGIN SCREEN --- */
        #login-modal {
            position: fixed; 
            inset: 0; 
            background: radial-gradient(circle at top center, #1E2640 0%, #0D0F12 70%);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 10;
            padding: 24px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #00F0FF 0%, #7000FF 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            color: #FFF;
            margin: 0 auto 16px;
            box-shadow: 0 12px 32px rgba(0, 240, 255, 0.25);
        }

        .brand-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #FFFFFF;
            margin-bottom: 6px;
        }

        .brand-header p {
            font-size: 14px;
            color: #9CA3AF;
        }

        .card {
            background: rgba(22, 27, 38, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 28px; 
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); 
            width: 100%; 
            max-width: 400px; 
        }

        .input-group {
            margin-bottom: 16px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #9CA3AF;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%; 
            padding: 14px 16px; 
            background: #11141C;
            border: 1px solid #2A303F;
            border-radius: 12px; 
            outline: none; 
            font-size: 15px; 
            color: #FFF;
            transition: all 0.2s ease;
        }

        input::placeholder { color: #4B5563; }

        input:focus { 
            border-color: #00F0FF; 
            box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.15);
        }

        .toggle-pwd {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: #6B7280;
            cursor: pointer;
            font-size: 14px;
            width: auto;
            padding: 0;
        }

        .toggle-pwd:hover { color: #FFF; }

        .submit-btn {
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(135deg, #00F0FF 0%, #00A3FF 100%); 
            color: #0D0F12; 
            border: none;
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 16px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            margin-top: 8px;
            box-shadow: 0 8px 20px rgba(0, 240, 255, 0.2);
        }

        .submit-btn:hover { 
            transform: translateY(-1px); 
            box-shadow: 0 12px 24px rgba(0, 240, 255, 0.3); 
        }

        .submit-btn:active { transform: translateY(0); }

        .card-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #6B7280;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10B981;
            border-radius: 50%;
            display: inline-block;
        }

        /* --- CHAT INTERFACE --- */
        #chat-app {
            display: none; 
            width: 100vw; 
            height: 100%;
            height: 100dvh;
            background: #0D0F12; 
            overflow: hidden; 
            flex-direction: column;
        }
        
        header { 
            background: #11141C; 
            color: #FFF; 
            padding: 14px 20px; 
            padding-top: max(14px, env(safe-area-inset-top));
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-size: 18px; 
            font-weight: 600; 
            flex-shrink: 0;
            border-bottom: 1px solid #2A303F;
        }

        .header-info { display: flex; flex-direction: column; }
        .online-status { font-size: 12px; color: #10B981; font-weight: 500; margin-top: 2px; }
        
        .clear-btn {
            background: rgba(239, 68, 68, 0.15); 
            color: #EF4444; 
            font-size: 12px; 
            padding: 8px 14px;
            border-radius: 20px; 
            width: auto; 
            font-weight: 600;
            border: 1px solid rgba(239, 68, 68, 0.3);
            cursor: pointer;
        }

        #messages {
            flex: 1; 
            padding: 16px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
            background: #0D0F12;
            -webkit-overflow-scrolling: touch;
        }

        .msg { 
            max-width: 82%; 
            padding: 12px 16px; 
            border-radius: 18px; 
            color: #FFF; 
            font-size: 15px; 
            position: relative; 
            word-wrap: break-word;
            line-height: 1.4;
        }

        .msg.sent { 
            align-self: flex-end; 
            background: #00F0FF; 
            color: #0D0F12; 
            border-bottom-right-radius: 4px; 
            font-weight: 500;
        }

        .msg.received { 
            align-self: flex-start; 
            background: #1E2640; 
            color: #F3F4F6; 
            border-bottom-left-radius: 4px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .msg .sender { font-size: 11px; font-weight: 700; opacity: 0.8; }
        .delete-icon { cursor: pointer; font-size: 12px; opacity: 0.6; margin-left: 8px; }
        .timer-badge { font-size: 10px; opacity: 0.7; margin-left: 4px; }

        .msg img { width: 100%; max-width: 260px; border-radius: 12px; margin-top: 6px; }
        .msg audio { width: 100%; max-width: 220px; margin-top: 6px; }
        .system { text-align: center; color: #6B7280; font-size: 12px; align-self: center; margin: 4px 0; }

        footer { 
            padding: 12px 16px; 
            padding-bottom: max(14px, env(safe-area-inset-bottom));
            background: #11141C; 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            position: relative;
            flex-shrink: 0;
            border-top: 1px solid #2A303F;
        }

        footer input[type="text"] { 
            margin-bottom: 0; 
            background: #1B202D; 
            color: #FFF; 
            border: 1px solid #2A303F; 
            font-size: 15px;
            padding: 12px 16px;
        }

        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; width: auto; padding: 4px; color: #9CA3AF; }
        .icon-btn:hover { color: #FFF; }
        
        #emoji-bar {
            display: none; 
            position: absolute; 
            bottom: calc(100% + 8px); 
            left: 16px; 
            background: #1E2640;
            padding: 10px; 
            border-radius: 14px; 
            gap: 10px;
            z-index: 5;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #emoji-bar span { cursor: pointer; font-size: 22px; transition: transform 0.1s ease; }
        #emoji-bar span:hover { transform: scale(1.2); }
    </style>
</head>
<body>

    <div id="login-modal">
        <div class="brand-header">
            <div class="brand-logo">A</div>
            <h1>Alpha Messenger</h1>
            <p>Private, ephemeral rooms that self-destruct</p>
        </div>

        <div class="card">
            <div class="input-group">
                <label for="codename-input">Codename</label>
                <input type="text" id="codename-input" placeholder="e.g. Maverick" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="room-input">Room Identifier</label>
                <input type="text" id="room-input" placeholder="e.g. Alpha" value="Alpha" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="password-input">Room Keycode</label>
                <div class="input-wrapper">
                    <input type="password" id="password-input" placeholder="Enter room keycode">
                    <button class="toggle-pwd" type="button" onclick="togglePasswordVisibility()">Show</button>
                </div>
            </div>

            <button class="submit-btn" onclick="joinRoom()">Enter Secure Room</button>

            <div class="card-footer">
                <span class="status-dot"></span>
                <span>Encrypted Socket Network Active</span>
            </div>
        </div>
    </div>

    <div id="chat-app">
        <header>
            <div class="header-info">
                <span id="room-header-title">✨ Alpha</span>
                <span id="online-users" class="online-status">🟢 1 online</span>
            </div>
            <button class="clear-btn" onclick="clearAllChat()">Clear Chat</button>
        </header>

        <div id="messages"></div>

        <div id="emoji-bar">
            <span onclick="addEmoji('❤️')">❤️</span>
            <span onclick="addEmoji('🔥')">🔥</span>
            <span onclick="addEmoji('😂')">😂</span>
            <span onclick="addEmoji('✨')">✨</span>
            <span onclick="addEmoji('🥺')">🥺</span>
        </div>

        <footer>
            <button class="icon-btn" onclick="toggleEmojiBar()">😊</button>
            <button class="icon-btn" onclick="document.getElementById('file-input').click()">📷</button>
            <button class="icon-btn" id="record-btn" onclick="toggleRecord()">🎙️</button>
            
            <input type="file" id="file-input" accept="image/*" style="display:none" onchange="sendFile(this)">
            <input type="text" id="msg-input" placeholder="Send an encrypted message..." onkeypress="handleKey(event)">
            <button class="submit-btn" onclick="sendText()" style="width: 70px; padding: 12px 0; font-size: 14px; margin-top:0;">Send</button>
        </footer>
    </div>

    <script>
        const socket = io({
            reconnection: true,
            reconnectionAttempts: 10,
            reconnectionDelay: 1000
        });

        let currentCodename = '';
        let currentRoomName = '';
        let currentPassword = '';
        let mediaRecorder;
        let audioChunks = [];

        // Restore saved details on page load
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('alpha_codename');
            const savedRoom = localStorage.getItem('alpha_room');
            if (savedName) document.getElementById('codename-input').value = savedName;
            if (savedRoom) document.getElementById('room-input').value = savedRoom;
        });

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password-input');
            const btn = document.querySelector('.toggle-pwd');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                btn.innerText = 'Hide';
            } else {
                pwdInput.type = 'password';
                btn.innerText = 'Show';
            }
        }

        function joinRoom() {
            currentCodename = document.getElementById('codename-input').value.trim();
            currentRoomName = document.getElementById('room-input').value.trim() || 'Alpha';
            currentPassword = document.getElementById('password-input').value.trim();

            if (!currentCodename || !currentPassword) return alert('Please enter your codename and room keycode!');

            // Save to local storage for quick return
            localStorage.setItem('alpha_codename', currentCodename);
            localStorage.setItem('alpha_room', currentRoomName);

            socket.emit('join-room', { codename: currentCodename, room: currentRoomName, password: currentPassword }, (res) => {
                if (res.success) {
                    document.getElementById('room-header-title').innerText = `✨ ${res.room}`;
                    document.getElementById('login-modal').style.display = 'none';
                    document.getElementById('chat-app').style.display = 'flex';
                    
                    const msgBox = document.getElementById('messages');
                    msgBox.scrollTop = msgBox.scrollHeight;
                } else {
                    alert(res.message);
                }
            });
        }

        socket.on('connect', () => {
            if (currentCodename && currentPassword) {
                socket.emit('join-room', { codename: currentCodename, room: currentRoomName, password: currentPassword }, () => {});
            }
        });

        socket.on('room-users-update', (data) => {
            const onlineText = document.getElementById('online-users');
            onlineText.innerText = `🟢 ${data.count} online (${data.users.join(', ')})`;
        });

        function sendText() {
            const input = document.getElementById('msg-input');
            if (!input.value.trim()) return;
            socket.emit('send-message', { type: 'text', content: input.value });
            input.value = '';
        }

        function handleKey(e) { if (e.key === 'Enter') sendText(); }

        function toggleEmojiBar() {
            const bar = document.getElementById('emoji-bar');
            bar.style.display = bar.style.display === 'flex' ? 'none' : 'flex';
        }

        function addEmoji(emoji) {
            document.getElementById('msg-input').value += emoji;
            toggleEmojiBar();
        }

        function sendFile(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                socket.emit('send-message', { type: 'image', content: e.target.result });
            };
            reader.readAsDataURL(file);
        }

        async function toggleRecord() {
            const btn = document.getElementById('record-btn');
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = e => {
                            socket.emit('send-message', { type: 'audio', content: e.target.result });
                        };
                        reader.readAsDataURL(blob);
                    };
                    mediaRecorder.start();
                    btn.innerText = "🛑";
                } catch (err) {
                    alert("Microphone access required for voice notes!");
                }
            } else {
                mediaRecorder.stop();
                btn.innerText = "🎙️";
            }
        }

        function deleteMsg(msgId) {
            socket.emit('delete-message', msgId);
        }

        function clearAllChat() {
            if (confirm("Are you sure you want to clear this room?")) {
                socket.emit('clear-chat');
            }
        }

        socket.on('system-message', (msg) => {
            const container = document.getElementById('messages');
            container.innerHTML += `<div class="system">${msg}</div>`;
            container.scrollTop = container.scrollHeight;
        });

        socket.on('receive-message', (data) => {
            const container = document.getElementById('messages');
            const isMe = data.sender === currentCodename;
            let body = '';

            if (data.type === 'text') body = data.content;
            else if (data.type === 'image') body = `<img src="${data.content}" />`;
            else if (data.type === 'audio') body = `<audio controls src="${data.content}"></audio>`;

            const html = `
                <div class="msg ${isMe ? 'sent' : 'received'}" id="${data.id}">
                    <div class="msg-header">
                        <span class="sender">${isMe ? 'You' : data.sender} • ${data.time} <span class="timer-badge">⏳60s</span></span>
                        <span class="delete-icon" onclick="deleteMsg('${data.id}')" title="Delete immediately">🗑️</span>
                    </div>
                    ${body}
                </div>
            `;
            container.innerHTML += html;
            container.scrollTop = container.scrollHeight;
        });

        socket.on('message-deleted', (msgId) => {
            const el = document.getElementById(msgId);
            if (el) el.remove();
        });

        socket.on('chat-cleared', () => {
            document.getElementById('messages').innerHTML = '<div class="system">Chat cleared 🧹</div>';
        });
    </script>
</body>
</html>
